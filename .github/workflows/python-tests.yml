name: Run Selenium Tests with Allure Report

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:   # запустим вручную

jobs:
  test:
    runs-on: ubuntu-latest

    steps: # склонируем репозиторий на тестовый сервер
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python # установим Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies # установим зависимости из файла
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Set up Chrome
      uses: browser-actions/setup-chrome@v1
      with:
        chrome-version: 'stable'

    - name: Run tests with Allure # запустим тесты
      run: |
        pytest --alluredir=allure-results
      continue-on-error: true   # отчёт сгенерируется даже при падении тестов

    - name: Install Allure CLI (via apt, надёжнее чем npm)
      run: |
        sudo apt-get update
        sudo apt-get install -y allure

    - name: Generate Allure Report
      run: |
        allure generate allure-result --clean -o allure-report

    - name: Deploy Allure report to GitHub Pages # отправим отчёт на ветку гитхаб pages и запустим отчет аллюр
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./allure-report
